name: Code Review
description: Review a pull request with OpenCode or Pi through OpenRouter and publish one managed comment
author: Dragos Cirjan

inputs:
  github-token:
    description: Personal access token used to read the pull request and publish the review
    required: true
  openrouter-api-key:
    description: OpenRouter API key used only inside the selected review backend sandbox
    required: true
  backend:
    description: Review backend. Accepted values are opencode and pi
    required: false
    default: opencode
  container-engine:
    description: Allowlisted container engine used for the review sandbox
    required: false
    default: podman
  model:
    description: OpenRouter model identifier. The POC supports only z-ai/glm-5.3-flash
    required: false
    default: z-ai/glm-5.3-flash
  prompt:
    description: Trusted review guidance appended to the fixed security prompt
    required: false
    default: Focus on correctness, security, regressions, and missing tests.
  opencode-version:
    description: Exact opencode-ai npm package version
    required: false
    default: 1.18.31
  pi-version:
    description: Exact @earendil-works/pi-coding-agent npm package version
    required: false
    default: 0.85.1
  max-diff-bytes:
    description: Maximum UTF-8 diff size sent to the review backend
    required: false
    default: "120000"
  timeout-seconds:
    description: Maximum review backend execution time
    required: false
    default: "600"

outputs:
  comment-url:
    description: URL of the created or updated review comment
  diff-truncated:
    description: Whether the pull request diff exceeded max-diff-bytes

runs:
  using: node24
  main: dist/index.js

branding:
  icon: code
  color: purple
