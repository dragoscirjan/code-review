name: Code Review
description: Review a pull request with OpenCode or Pi through a configured model endpoint and publish one managed comment
author: Dragos Cirjan

inputs:
  github-token:
    description: Personal access token used to read the pull request and publish the review
    required: true
  model-config:
    description: Version 1 JSON selecting provider API, baseUrl, remote/private network permission and model; see README
    required: true
  model-credentials:
    description: Secret JSON mapping credential references to bearer or api-key tokens; only the selected credential enters the sandbox
    required: false
  backend:
    description: Review backend. Accepted values are opencode and pi
    required: false
    default: opencode
  container-engine:
    description: Allowlisted container engine used for the review sandbox
    required: false
    default: podman
  prompt:
    description: Trusted review guidance appended to the fixed security prompt
    required: false
    default: Focus on correctness, security, regressions, and missing tests.
  opencode-version:
    description: Exact opencode-ai npm package version
    required: false
    default: 1.18.31
  pi-version:
    description: Exact @earendil-works/pi-coding-agent npm package version
    required: false
    default: 0.85.1
  code-indexer:
    description: Code indexer installed for base-revision context. Accepted values are none, cgc, and gitnexus
    required: false
    default: none
  code-index-cache-key:
    description: Cache key prefix for the selected indexer's database
    required: false
    default: code-review-index-v1
  code-index-cache-ttl:
    description: Maximum cache age before the action rebuilds the code index
    required: false
    default: 24h
  max-diff-bytes:
    description: Maximum UTF-8 diff size sent to the review backend
    required: false
    default: "120000"
  timeout-seconds:
    description: Maximum review backend execution time
    required: false
    default: "600"

outputs:
  comment-url:
    description: URL of the created or updated review comment
  diff-truncated:
    description: Whether the pull request diff exceeded max-diff-bytes
  code-index-cache-hit:
    description: Whether a fresh code index database cache was restored
  code-indexer:
    description: Selected code indexer

runs:
  using: node24
  main: dist/index.js

branding:
  icon: code
  color: purple
