name: Code Review
description: Review a pull request with OpenCode or Pi and publish a validated summary with optional inline comments
author: Dragos Cirjan

inputs:
  github-token:
    description: Personal access token used to read the pull request and publish the review
    required: true
  model-config:
    description: Version 1 JSON selecting provider API, baseUrl, remote/private network permission and model; see README
    required: true
  model-credentials:
    description: Secret JSON mapping credential references to bearer or api-key tokens; only the selected credential enters the sandbox
    required: false
  backend:
    description: Review backend. Accepted values are opencode and pi
    required: false
    default: opencode
  container-engine:
    description: Allowlisted container engine used for the review sandbox
    required: false
    default: podman
  prompt:
    description: Trusted review guidance appended to the fixed security prompt
    required: false
    default: Focus on correctness, security, regressions, and missing tests.
  opencode-version:
    description: Exact opencode-ai npm package version
    required: false
    default: 1.18.31
  pi-version:
    description: Exact @earendil-works/pi-coding-agent npm package version
    required: false
    default: 0.85.1
  code-indexer:
    description: Code indexer installed for base-revision context. Accepted values are none, cgc, and gitnexus
    required: false
    default: none
  code-index-cache-key:
    description: Cache key prefix for the selected indexer's database
    required: false
    default: code-review-index-v1
  code-index-cache-ttl:
    description: Maximum cache age before the action rebuilds the code index
    required: false
    default: 24h
  max-diff-bytes:
    description: Maximum UTF-8 diff size sent to the review backend, packed at complete hunk boundaries
    required: false
    default: '120000'
  minimum-confidence:
    description: Inclusive minimum confidence for validated findings (0 through 1)
    required: false
    default: '0'
  max-inline-comments:
    description: Maximum validated findings published in one inline review batch (0 disables inline publication)
    required: false
    default: '0'
  deterministic-analyzers:
    description: Fixed in-process analyzers. Accepted values are none and base-config
    required: false
    default: none
  review-strategy:
    description: Review execution strategy. Accepted values are single-pass, specialists, and auto
    required: false
    default: auto
  specialist-token-budget:
    description: Aggregate conservative prompt, envelope, and maximum-output token reservation for specialist review
    required: false
    default: '300000'
  timeout-seconds:
    description: Maximum single-pass execution time or aggregate specialist and arbiter execution time
    required: false
    default: '600'

outputs:
  comment-url:
    description: URL of the created or updated review comment
  diff-truncated:
    description: Whether complete diff hunks were omitted to fit max-diff-bytes
  context-truncated:
    description: Whether any supplemental review context was truncated by a source or aggregate byte limit
  context-unavailable-source-count:
    description: Number of supplemental context sources unavailable, unsupported, timed out, or skipped by budget
  review-mode:
    description: Lifecycle mode used for this run (full, incremental, migration, or no-change)
  review-strategy:
    description: Selected execution strategy (single-pass or specialists)
  specialist-role-count:
    description: Number of fixed specialist roles completed
  specialist-candidate-count:
    description: Number of validated model candidates presented to the arbiter
  arbiter-rejected-count:
    description: Number of validated candidate IDs rejected by the arbiter
  new-finding-count:
    description: Number of active findings first seen at the reviewed head
  unchanged-finding-count:
    description: Number of active findings retained from the previous completed review
  resolved-finding-count:
    description: Number of previous findings resolved in this generation
  superseded-finding-count:
    description: Number of previous findings replaced by a changed finding at the same stable anchor
  review-url:
    description: URL of the created or reused inline pull request review, empty when inline publication is disabled
  inline-comment-count:
    description: Number of validated inline comments selected for publication
  inline-history-suppressed-count:
    description: Number of accepted findings suppressed because their inline fingerprint was already published
  inline-limit-omitted-count:
    description: Number of new eligible findings omitted by max-inline-comments
  analyzer-coverage:
    description: Deterministic analyzer coverage (complete or partial)
  analyzer-run-count:
    description: Number of fixed deterministic analyzers run
  analyzer-observation-count:
    description: Number of analyzer observations accepted after exact diff mapping
  analyzer-skipped-file-count:
    description: Number of supported files skipped by deterministic analyzer limits or acquisition failures
  code-index-cache-hit:
    description: Whether a fresh code index database cache was restored
  code-indexer:
    description: Selected code indexer

runs:
  using: node24
  main: dist/index.js

branding:
  icon: code
  color: purple
