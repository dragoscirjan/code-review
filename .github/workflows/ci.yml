name: CI

'on':
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: npm ci
      - name: Validate including recorded review evaluation
        env:
          REVIEW_EVALUATION_OUTPUT_DIR: ${{ runner.temp }}/review-evaluation
        run: mise run validate
      - name: Upload deterministic review evaluation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-evaluation
          path: |
            ${{ runner.temp }}/review-evaluation/review-evaluation.json
            ${{ runner.temp }}/review-evaluation/review-evaluation.md
          if-no-files-found: warn
          retention-days: 14
      - name: Verify Podman sandbox flags
        run: |
          podman --version
          podman run --rm \
            --network bridge \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1536m \
            --workdir /tmp \
            --user 65534:65534 \
            docker.io/library/node:24.14.0-bookworm-slim@sha256:4bd6219054c8bebcd26a66bfd8ca0bd6e1024b4b97474c59bb7ee3bbcbef4fe8 \
            node --version
      - name: Verify Docker sandbox flags
        run: |
          docker --version
          docker run --rm \
            --network bridge \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1536m \
            --workdir /tmp \
            --user 65534:65534 \
            docker.io/library/node:24.14.0-bookworm-slim@sha256:4bd6219054c8bebcd26a66bfd8ca0bd6e1024b4b97474c59bb7ee3bbcbef4fe8 \
            node --version
      - name: Verify bundled action
        run: |
          git ls-files --error-unmatch dist/index.js
          git diff --exit-code -- dist/index.js

  model-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        backend: [opencode, pi]
        engine: [podman, docker]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify native model configuration against controlled endpoints
        env:
          REVIEW_TEST_BACKEND: ${{ matrix.backend }}
          CONTAINER_ENGINE: ${{ matrix.engine }}
        run: npm run test:models

  indexer-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        indexer: [cgc, gitnexus]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        if: matrix.indexer == 'cgc'
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install and run ${{ matrix.indexer }}
        env:
          CODE_INDEXER: ${{ matrix.indexer }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:indexers
