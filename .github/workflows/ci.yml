name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Verify Podman sandbox flags
        run: |
          podman --version
          podman run --rm \
            --network bridge \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1536m \
            --workdir /tmp \
            --user 65534:65534 \
            docker.io/library/node:24.14.0-bookworm-slim@sha256:4bd6219054c8bebcd26a66bfd8ca0bd6e1024b4b97474c59bb7ee3bbcbef4fe8 \
            node --version
      - name: Verify bundled action
        run: |
          git ls-files --error-unmatch dist/index.js
          git diff --exit-code -- dist/index.js
