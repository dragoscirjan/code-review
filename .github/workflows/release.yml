name: Release versioned action

'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: action-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: npm ci
      - name: Validate and rebuild committed artifacts
        run: mise run validate
      - name: Prove generated bundles are committed and clean
        run: |
          git ls-files --error-unmatch dist/index.js dist/action-release.js
          test -z "$(git status --porcelain=v1 --untracked-files=all -- dist)"
      - name: Resolve and plan exact release without writes
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_MAIN_SHA: ${{ github.sha }}
        run: |
          plan_path="$RUNNER_TEMP/action-release-plan.json"
          node dist/action-release.js plan \
            --bump "$RELEASE_BUMP" \
            --repository "$RELEASE_REPOSITORY" \
            --expected-main-sha "$RELEASE_MAIN_SHA" > "$plan_path"
          node -e '
            const fs = require("node:fs");
            const plan = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const version = plan?.version?.tag;
            if (typeof version !== "string" || !/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) process.exit(1);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`, "utf8");
            process.stdout.write(`${JSON.stringify(plan, null, 2)}\n`);
          ' "$plan_path"

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out only the reviewed publisher bundle
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: dist/action-release.js
          sparse-checkout-cone-mode: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Publish and verify version tags and GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_MAIN_SHA: ${{ github.sha }}
        run: >-
          node dist/action-release.js publish
          --version "$RELEASE_VERSION"
          --repository "$RELEASE_REPOSITORY"
          --expected-main-sha "$RELEASE_MAIN_SHA"
