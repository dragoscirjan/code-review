name: Release versioned action

'on':
  workflow_dispatch:
    inputs:
      version:
        description: Canonical stable action version (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions: {}

concurrency:
  group: action-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: npm ci
      - name: Validate and rebuild committed artifacts
        run: mise run validate
      - name: Prove generated bundles are committed and clean
        run: |
          git ls-files --error-unmatch dist/index.js dist/action-release.js
          test -z "$(git status --porcelain=v1 --untracked-files=all -- dist)"
      - name: Plan exact release without writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MAIN_SHA: ${{ github.sha }}
        run: >-
          node dist/action-release.js plan
          --version "$RELEASE_VERSION"
          --repository "$RELEASE_REPOSITORY"
          --expected-main-sha "$RELEASE_MAIN_SHA"

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out only the reviewed publisher bundle
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: dist/action-release.js
          sparse-checkout-cone-mode: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Publish and verify version tags and GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MAIN_SHA: ${{ github.sha }}
        run: >-
          node dist/action-release.js publish
          --version "$RELEASE_VERSION"
          --repository "$RELEASE_REPOSITORY"
          --expected-main-sha "$RELEASE_MAIN_SHA"
